name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  QT_VERSION: 6.9.3

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for emoji
        run: python scripts/check_no_emoji.py

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libvulkan-dev glslang-tools glslc libfuse2 \
            libxcb-cursor0 libxcb-xinerama0 file desktop-file-utils

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtshadertools
          cache: true

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSD_VULKAN=ON
          -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage install tree
        run: cmake --install build --prefix dist/AppDir/usr

      - name: Prepare AppDir metadata
        run: |
          install -Dm644 packaging/linux/VesperImageGenerator.desktop \
            dist/AppDir/usr/share/applications/VesperImageGenerator.desktop
          install -Dm644 packaging/linux/VesperImageGenerator.png \
            dist/AppDir/usr/share/icons/hicolor/256x256/apps/VesperImageGenerator.png

      - name: Build AppImage
        run: |
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLo linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QML_SOURCES_PATHS="$PWD/qml"
          export OUTPUT="VesperImageGeneratorPro-x86_64.AppImage"
          ./linuxdeploy --appdir dist/AppDir --plugin qt --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage"
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: false
          cache: true
          stripdown: true

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats qtshadertools
          cache: true

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSD_VULKAN=ON
          -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage portable build
        shell: bash
        run: |
          mkdir -p dist/windows
          cp build/VesperImageGenerator.exe dist/windows/
          cp build/sd-cli.exe dist/windows/
          windeployqt --release --qmldir qml --no-translations dist/windows/VesperImageGenerator.exe

      - name: Build installer
        run: >
          iscc /DAppVersion=${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          "/DSourceDir=${{ github.workspace }}\dist\windows"
          "/DOutputDir=${{ github.workspace }}\dist\installer"
          packaging\windows\vesper.iss

      - name: Zip portable build
        shell: bash
        run: |
          cd dist/windows
          7z a -tzip "../VesperImageGeneratorPro-windows-portable.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
            dist/*.zip
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        run: brew install ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtshadertools
          cache: true

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSD_METAL=ON
          -DGGML_NATIVE=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Bundle and sign
        run: |
          APP="build/VesperImageGenerator.app"
          test -x "$APP/Contents/MacOS/sd-cli"
          macdeployqt "$APP" -qmldir=qml
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Build disk image
        run: |
          mkdir -p dist/dmg
          cp -R build/VesperImageGenerator.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Vesper Image Generator Pro" \
            -srcfolder dist/dmg -ov -format UDZO \
            VesperImageGeneratorPro-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "*.dmg"
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build changelog from commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          fi
          echo "## Changes" > CHANGELOG_BODY.md
          git log "$RANGE" --no-merges --pretty=format:"- %s (%h)" >> CHANGELOG_BODY.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG_BODY.md
          files: artifacts/**/*
